[package]
name = "minivna"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Native Rust CLI for controlling the miniVNA Tiny and collecting VNA measurements"

[[bin]]
name = "minivna"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = true }
clap = { version = "4.6.4", features = ["derive"] }
num-complex = "0.4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.9.0", default-features = false }
signal-hook = "0.4.4"
thiserror = "2.0.19"
toml = "1.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
